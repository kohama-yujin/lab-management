<dialog id="session-detail-dialog" class="session-detail-dialog" aria-labelledby="session-detail-title">
  <div class="session-detail-panel">
    <header class="session-detail-head">
      <div>
        <h2 id="session-detail-title" class="session-detail-title"></h2>
        <p id="session-detail-meta" class="session-detail-meta"></p>
      </div>
      <button type="button" id="session-detail-close" class="session-detail-close" aria-label="閉じる">
        ×
      </button>
    </header>
    <div class="session-detail-body">
      <div id="session-detail-notes" class="session-detail-notes" hidden></div>
      <div class="session-detail-kpis">
        <div class="session-detail-kpi present">
          <span class="label">総在室</span>
          <span id="session-detail-total" class="value">—</span>
        </div>
        <div class="session-detail-kpi">
          <span class="label">在室セッション</span>
          <span id="session-detail-count" class="value">—</span>
        </div>
      </div>
      <div class="session-detail-chart" aria-hidden="true">
        <div id="session-detail-axis-top" class="session-detail-axis-top"></div>
        <div id="session-detail-bar" class="session-detail-bar"></div>
        <div id="session-detail-axis-bottom" class="session-detail-axis-bottom"></div>
      </div>
      <div class="session-detail-table-wrap">
        <table class="session-detail-table">
          <thead>
            <tr>
              <th></th>
              <th>入室</th>
              <th>退室</th>
              <th>在室</th>
            </tr>
          </thead>
          <tbody id="session-detail-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</dialog>

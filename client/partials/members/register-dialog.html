<dialog id="register-dialog" class="member-dialog" aria-labelledby="register-dialog-title">
  <form id="register-form" method="dialog" class="member-form" novalidate>
    <h2 id="register-dialog-title" class="dialog-title">メンバー登録</h2>
    <p id="register-error" class="form-error" hidden></p>

    <label class="form-field">
      <span class="form-label">名前</span>
      <input
        type="text"
        name="name"
        autocomplete="name"
        maxlength="10"
      />
      <span class="form-hint">10 文字以内</span>
    </label>

    <label class="form-field">
      <span class="form-label">学年</span>
      <select name="grade"></select>
    </label>

    <label class="form-field">
      <span class="form-label">役職</span>
      <select name="role"></select>
    </label>

    <label class="form-field">
      <span class="form-label">ユーザー名</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        maxlength="16"
        placeholder="例: tanaka"
      />
      <span class="form-hint">3〜16文字、英数字と _ のみ</span>
    </label>

    <label class="form-field">
      <span class="form-label">パスワード</span>
      <input
        type="password"
        name="password"
        autocomplete="new-password"
        maxlength="128"
        placeholder="8文字以上"
      />
      <span class="form-hint">8文字以上</span>
    </label>

    <label class="form-field">
      <span class="form-label">パスワード（確認）</span>
      <input
        type="password"
        name="password_confirm"
        autocomplete="new-password"
        maxlength="128"
        placeholder="もう一度入力"
      />
    </label>

    <div class="dialog-actions">
      <button type="button" class="dialog-btn" data-close-dialog>キャンセル</button>
      <button type="submit" class="dialog-btn dialog-btn-primary">登録</button>
    </div>
  </form>
</dialog>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; media-src {{cspSource}};">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Tools 在室</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
  <div id="app">
    <p id="banner" class="banner" hidden></p>

    <section class="section">
      <h2 class="section-title">自分の状態</h2>
      <div id="self-area" class="self-area"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">在室状況</h2>
        <span id="last-updated" class="last-updated" hidden></span>
      </div>
      <div id="boards" class="boards"></div>
    </section>
  </div>

  <audio id="checkin-sound" src="{{checkinSoundUri}}" preload="auto"></audio>
  <audio id="checkout-sound" src="{{checkoutSoundUri}}" preload="auto"></audio>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
